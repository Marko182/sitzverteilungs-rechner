<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sitzverteilung & Koalitionsrechner - Rat der Stadt Hameln</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Spezielle Druck-Styles für ein kompaktes 1-Seiten-Ergebnis-PDF */
        @media print {
            .no-print {
                display: none !important;
            }
            @page {
                size: A4 portrait;
                margin: 8mm;
            }
            body {
                background: white !important;
                color: black !important;
                padding: 0 !important;
                font-size: 11px !important;
            }
            .print-card {
                box-shadow: none !important;
                border: 1px solid #cbd5e1 !important;
                break-inside: avoid !important;
                padding: 8px !important;
                margin-bottom: 8px !important;
            }
            .print-grid-2 {
                display: grid !important;
                grid-template-cols: repeat(2, minmax(0, 1fr)) !important;
                gap: 8px !important;
            }
            .print-grid-3 {
                display: grid !important;
                grid-template-cols: repeat(3, minmax(0, 1fr)) !important;
                gap: 8px !important;
            }
            svg {
                max-height: 140px !important;
            }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 p-3 md:p-6">

    <div class="max-w-7xl mx-auto space-y-4">
        
        <!-- Header & Action-Bar -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center bg-white p-4 rounded-xl shadow-sm border border-slate-200 gap-3">
            <div>
                <div class="flex items-center gap-2">
                    <h1 class="text-xl font-bold text-slate-900">Rat der Stadt Hameln – Ergebnisse & Sitzverteilung</h1>
                    <span class="bg-emerald-100 text-emerald-800 text-xs font-semibold px-2 py-0.5 rounded-full border border-emerald-200 flex items-center gap-1 no-print">
                        <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path></svg>
                        Gespeichert
                    </span>
                </div>
            </div>
            <div class="flex items-center gap-3 no-print">
                <button onclick="window.print()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg font-medium text-sm shadow-sm transition flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                    Drucken / Als PDF speichern
                </button>
            </div>
        </header>

        <!-- Parteien-Verwaltung -->
        <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 no-print">
            <div class="flex justify-between items-center mb-3">
                <h2 class="font-bold text-base text-slate-800">1. Parteien & Fraktionen konfigurieren</h2>
                <div class="flex gap-2">
                    <button onclick="loadPreset('hameln')" class="px-2.5 py-1 text-xs bg-slate-100 hover:bg-slate-200 rounded font-medium text-slate-700">Hameln Standard</button>
                    <button onclick="loadPreset('empty')" class="px-2.5 py-1 text-xs bg-slate-100 hover:bg-slate-200 rounded font-medium text-slate-700">Alle löschen</button>
                </div>
            </div>
            
            <div id="parties-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-2 mb-3">
                <!-- Parteien-Karten -->
            </div>

            <div class="flex gap-2">
                <input type="text" id="new-party-name" placeholder="Neue Partei..." class="px-3 py-1.5 border rounded-lg text-xs w-40 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <input type="number" id="new-party-seats" placeholder="Sitze" min="1" value="2" class="px-3 py-1.5 border rounded-lg text-xs w-20 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <input type="color" id="new-party-color" value="#3b82f6" class="h-8 w-10 rounded cursor-pointer border p-0.5">
                <button onclick="addParty()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition">+ Hinzufügen</button>
            </div>
        </section>

        <!-- Ergebnis-Übersicht & Grafik -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4 print-grid-3">
            
            <!-- SVG Grafikkarte mit Typ-Umschalter -->
            <div class="lg:col-span-2 bg-white p-4 rounded-xl shadow-sm border border-slate-200 print-card">
                <div class="flex justify-between items-center mb-2 flex-wrap gap-2">
                    <h2 class="font-bold text-sm text-slate-800">Sitzverteilung Rat</h2>
                    
                    <!-- Umschalter für Grafiktypen -->
                    <div class="flex items-center gap-1 bg-slate-100 p-0.5 rounded-lg no-print">
                        <button onclick="setChartType('arc')" id="btn-chart-arc" class="px-2 py-0.5 text-xs font-medium rounded bg-white shadow-sm text-slate-800">Halbkreis</button>
                        <button onclick="setChartType('bar')" id="btn-chart-bar" class="px-2 py-0.5 text-xs font-medium rounded text-slate-600 hover:text-slate-900">Balken</button>
                        <button onclick="setChartType('donut')" id="btn-chart-donut" class="px-2 py-0.5 text-xs font-medium rounded text-slate-600 hover:text-slate-900">Donut</button>
                    </div>

                    <span id="total-seats-badge" class="bg-slate-100 text-slate-700 font-semibold px-2.5 py-0.5 rounded-full text-xs">Gesamtsitze: 42</span>
                </div>
                
                <div class="w-full flex justify-center items-center py-1 min-h-[160px]" id="chart-render-area">
                    <!-- Dynamische SVG Grafik -->
                </div>

                <div id="party-legend" class="flex flex-wrap gap-3 justify-center mt-2 text-[11px] font-medium">
                    <!-- Legende -->
                </div>
            </div>

            <!-- Mehrheits-Schwellen -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 print-card flex flex-col justify-between">
                <div>
                    <h2 class="font-bold text-sm mb-3 text-slate-800">Mehrheiten</h2>
                    <div class="space-y-2">
                        <div class="p-2 bg-slate-50 rounded border">
                            <div class="text-[10px] text-slate-500 font-medium">Einfache Mehrheit (>50%)</div>
                            <div id="simple-majority-seats" class="text-base font-bold text-slate-800">22 Sitze</div>
                        </div>
                        <div class="p-2 bg-slate-50 rounded border">
                            <div class="text-[10px] text-slate-500 font-medium">2/3 Mehrheit</div>
                            <div id="twothird-majority-seats" class="text-base font-bold text-slate-800">28 Sitze</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bündnisse -->
        <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 print-card">
            <div class="flex justify-between items-center mb-3">
                <h2 class="font-bold text-sm text-slate-800">Gebildete Bündnisse & Koalitionen</h2>
                <button onclick="addGroup()" class="bg-purple-600 hover:bg-purple-700 text-white px-2.5 py-1 rounded-lg text-xs font-medium transition no-print">+ Gruppe anlegen</button>
            </div>

            <div id="groups-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3 print-grid-3">
                <!-- Bündnisse -->
            </div>
        </section>

        <!-- Ausschuss-Ergebnisse -->
        <section class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 print-card">
            <div class="flex justify-between items-center mb-3">
                <h2 class="font-bold text-sm text-slate-800">Ausschuss-Ergebnisse & Zugriffsreihenfolge</h2>

                <div class="flex items-center gap-2 no-print">
                    <label class="text-xs font-semibold text-slate-600">Verfahren:</label>
                    <select id="calc-method" onchange="renderAll()" class="border rounded px-2 py-1 text-xs bg-slate-50 font-medium focus:outline-none">
                        <option value="sainte-lague">Saint-Laguë / Schepers</option>
                        <option value="dhondt">D'Hondt</option>
                        <option value="hare-niemeyer">Hare-Niemeyer</option>
                    </select>
                </div>
            </div>

            <!-- Ausschuss hinzufügen Formular -->
            <div class="flex gap-2 mb-4 p-2 bg-slate-50 rounded border border-slate-200 no-print">
                <input type="text" id="new-committee-name" placeholder="Ausschuss-Name..." class="px-2.5 py-1 border rounded text-xs flex-1 focus:outline-none">
                <input type="number" id="new-committee-seats" placeholder="Sitze" min="1" value="9" class="px-2.5 py-1 border rounded text-xs w-20 focus:outline-none">
                <button onclick="addCommittee()" class="bg-slate-700 hover:bg-slate-800 text-white px-3 py-1 rounded text-xs font-medium transition">+ Anlegen</button>
            </div>

            <div id="committees-container" class="grid grid-cols-1 md:grid-cols-2 gap-3 print-grid-2">
                <!-- Dynamische Ausschusstabellen -->
            </div>
        </section>

    </div>

    <!-- JavaScript Logik -->
    <script>
        const defaultParties = [
            { id: 'p1', name: 'CDU', seats: 12, color: '#1e293b' },
            { id: 'p2', name: 'SPD', seats: 11, color: '#e11d48' },
            { id: 'p3', name: 'AfD', seats: 7, color: '#0284c7' },
            { id: 'p4', name: 'GRÜNE', seats: 6, color: '#16a34a' },
            { id: 'p5', name: 'Die Linke', seats: 3, color: '#c026d3' },
            { id: 'p6', name: 'FDP', seats: 2, color: '#eab308' },
            { id: 'p7', name: 'Frischer Wind', seats: 1, color: '#f97316' }
        ];

        const defaultGroups = [];

        const defaultCommittees = [
            { id: 'c1', name: 'Verwaltungsausschuss (VA)', seats: 9 },
            { id: 'c2', name: 'Ausschuss für Finanzen & Wirtschaft', seats: 9 },
            { id: 'c3', name: 'Ausschuss für Stadtentwicklung', seats: 9 },
            { id: 'c4', name: 'Ausschuss für Familie & Sport', seats: 9 },
            { id: 'c5', name: 'Ausschuss für Umwelt & Klimaschutz', seats: 9 },
            { id: 'c6', name: 'Ausschuss für Recht & Ordnung', seats: 9 },
            { id: 'c7', name: 'Ausschuss für Kultur', seats: 9 }
        ];

        let parties = [];
        let groups = [];
        let committees = [];
        let currentChartType = 'arc'; // 'arc', 'bar', 'donut'

        function setChartType(type) {
            currentChartType = type;
            ['arc', 'bar', 'donut'].forEach(t => {
                const btn = document.getElementById(`btn-chart-${t}`);
                if (btn) {
                    if (t === type) {
                        btn.className = 'px-2 py-0.5 text-xs font-medium rounded bg-white shadow-sm text-slate-800';
                    } else {
                        btn.className = 'px-2 py-0.5 text-xs font-medium rounded text-slate-600 hover:text-slate-900';
                    }
                }
            });
            renderAll();
        }

        function saveData() {
            const dataToSave = {
                parties: parties,
                groups: groups,
                committees: committees,
                calcMethod: document.getElementById('calc-method').value,
                chartType: currentChartType
            };
            localStorage.setItem('hameln_rechner_state', JSON.stringify(dataToSave));
        }

        function loadSavedData() {
            const saved = localStorage.getItem('hameln_rechner_state');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    parties = parsed.parties || defaultParties;
                    groups = parsed.groups || defaultGroups;
                    committees = parsed.committees || defaultCommittees;
                    if (parsed.calcMethod) document.getElementById('calc-method').value = parsed.calcMethod;
                    if (parsed.chartType) setChartType(parsed.chartType);
                    return;
                } catch(e) {}
            }
            parties = [...defaultParties];
            groups = [...defaultGroups];
            committees = [...defaultCommittees];
        }

        function loadPreset(type) {
            if (type === 'hameln') {
                parties = JSON.parse(JSON.stringify(defaultParties));
                groups = JSON.parse(JSON.stringify(defaultGroups));
                committees = JSON.parse(JSON.stringify(defaultCommittees));
            } else if (type === 'empty') {
                parties = [];
                groups = [];
                committees = [];
            }
            renderAll();
        }

        function addParty() {
            const nameInput = document.getElementById('new-party-name');
            const seatsInput = document.getElementById('new-party-seats');
            const colorInput = document.getElementById('new-party-color');

            const name = nameInput.value.trim();
            const seats = parseInt(seatsInput.value);
            const color = colorInput.value;

            if (!name || isNaN(seats) || seats <= 0) return;

            parties.push({ id: 'p_' + Date.now(), name, seats, color });
            nameInput.value = '';
            renderAll();
        }

        function removeParty(id) {
            parties = parties.filter(p => p.id !== id);
            groups.forEach(g => { g.partyIds = g.partyIds.filter(pId => pId !== id); });
            renderAll();
        }

        function updatePartySeats(id, value) {
            const seats = parseInt(value);
            const party = parties.find(p => p.id === id);
            if (party && !isNaN(seats) && seats >= 0) {
                party.seats = seats;
                renderAll();
            }
        }

        function addGroup() {
            groups.push({ id: 'g_' + Date.now(), name: 'Neues Bündnis', partyIds: [], color: '#6366f1' });
            renderAll();
        }

        function removeGroup(id) {
            groups = groups.filter(g => g.id !== id);
            renderAll();
        }

        function togglePartyInGroup(groupId, partyId) {
            const group = groups.find(g => g.id === groupId);
            if (!group) return;
            if (group.partyIds.includes(partyId)) {
                group.partyIds = group.partyIds.filter(id => id !== partyId);
            } else {
                group.partyIds.push(partyId);
            }
            renderAll();
        }

        function updateGroupName(groupId, name) {
            const group = groups.find(g => g.id === groupId);
            if (group) { group.name = name; renderAll(); }
        }

        function addCommittee() {
            const nameInput = document.getElementById('new-committee-name');
            const seatsInput = document.getElementById('new-committee-seats');
            const name = nameInput.value.trim();
            const seats = parseInt(seatsInput.value);
            if (!name || isNaN(seats) || seats <= 0) return;

            committees.push({ id: 'c_' + Date.now(), name, seats });
            nameInput.value = '';
            renderAll();
        }

        function removeCommittee(id) {
            committees = committees.filter(c => c.id !== id);
            renderAll();
        }

        function updateCommitteeSeats(id, value) {
            const seats = parseInt(value);
            const committee = committees.find(c => c.id === id);
            if (committee && !isNaN(seats) && seats > 0) {
                committee.seats = seats;
                renderAll();
            }
        }

        function getEntitiesForCalculation() {
            let groupedPartyIds = new Set();
            groups.forEach(g => g.partyIds.forEach(id => groupedPartyIds.add(id)));
            let entities = [];

            groups.forEach(g => {
                let totalSeats = 0;
                let memberNames = [];
                g.partyIds.forEach(pId => {
                    let p = parties.find(x => x.id === pId);
                    if (p) { totalSeats += p.seats; memberNames.push(p.name); }
                });
                if (totalSeats > 0) {
                    entities.push({ id: g.id, name: g.name, details: memberNames.join('+'), seats: totalSeats, color: g.color || '#6366f1' });
                }
            });

            parties.forEach(p => {
                if (!groupedPartyIds.has(p.id) && p.seats > 0) {
                    entities.push({ id: p.id, name: p.name, details: 'Einzeln', seats: p.seats, color: p.color });
                }
            });
            return entities;
        }

        function calculateCommitteeSeats(committeeSeats, method) {
            const entities = getEntitiesForCalculation();
            const totalCouncilSeats = parties.reduce((sum, p) => sum + p.seats, 0);

            if (totalCouncilSeats === 0 || entities.length === 0) return { summary: [], steps: [] };

            let steps = [];
            let resultSeats = {};
            entities.forEach(e => resultSeats[e.id] = 0);

            if (method === 'dhondt' || method === 'sainte-lague') {
                let scores = [];
                entities.forEach(entity => {
                    for (let step = 1; step <= committeeSeats; step++) {
                        let divisor = (method === 'dhondt') ? step : (step - 0.5);
                        scores.push({ entityId: entity.id, entityName: entity.name, color: entity.color, value: entity.seats / divisor });
                    }
                });
                scores.sort((a, b) => b.value - a.value);

                for (let i = 0; i < committeeSeats; i++) {
                    let winner = scores[i];
                    if (winner) {
                        resultSeats[winner.entityId] = (resultSeats[winner.entityId] || 0) + 1;
                        steps.push({ rank: i + 1, entityName: winner.entityName, color: winner.color, value: winner.value.toFixed(2) });
                    }
                }
            } else if (method === 'hare-niemeyer') {
                let exactQuotas = [];
                let totalAssigned = 0;
                entities.forEach(entity => {
                    let exact = (entity.seats * committeeSeats) / totalCouncilSeats;
                    let guaranteed = Math.floor(exact);
                    resultSeats[entity.id] = guaranteed;
                    totalAssigned += guaranteed;
                    exactQuotas.push({ entityId: entity.id, entityName: entity.name, color: entity.color, exact, remainder: exact - guaranteed });
                });

                let remainingSeats = committeeSeats - totalAssigned;
                exactQuotas.sort((a, b) => b.remainder - a.remainder);
                for (let i = 0; i < remainingSeats; i++) {
                    if (exactQuotas[i]) resultSeats[exactQuotas[i].entityId] += 1;
                }

                exactQuotas.sort((a, b) => b.exact - a.exact);
                let rank = 1;
                exactQuotas.forEach(eq => {
                    let totalCount = resultSeats[eq.entityId];
                    for (let c = 0; c < totalCount; c++) {
                        if (rank <= committeeSeats) {
                            steps.push({ rank: rank++, entityName: eq.entityName, color: eq.color, value: eq.exact.toFixed(2) });
                        }
                    }
                });
            }

            let summary = entities.map(e => ({
                name: e.name, details: e.details, color: e.color, assignedSeats: resultSeats[e.id] || 0
            }));

            return { summary, steps };
        }

        function renderAll() {
            saveData();
            const totalSeats = parties.reduce((sum, p) => sum + p.seats, 0);
            document.getElementById('total-seats-badge').innerText = `Gesamtsitze: ${totalSeats}`;
            document.getElementById('simple-majority-seats').innerText = `${Math.floor(totalSeats / 2) + 1} Sitze`;
            document.getElementById('twothird-majority-seats').innerText = `${Math.ceil((totalSeats * 2) / 3)} Sitze`;

            renderPartyInputs();
            renderChart(totalSeats);
            renderGroups();
            renderCommittees();
        }

        function renderPartyInputs() {
            const container = document.getElementById('parties-container');
            container.innerHTML = '';
            parties.forEach(p => {
                const card = document.createElement('div');
                card.className = 'p-1.5 bg-slate-50 border rounded flex items-center justify-between gap-1 text-xs';
                card.innerHTML = `
                    <div class="flex items-center gap-1.5 truncate">
                        <span class="w-3 h-3 rounded-full flex-shrink-0" style="background-color: ${p.color}"></span>
                        <span class="font-medium truncate">${p.name}</span>
                    </div>
                    <div class="flex items-center gap-1">
                        <input type="number" min="0" value="${p.seats}" onchange="updatePartySeats('${p.id}', this.value)" class="w-12 px-1 py-0.5 border rounded text-right">
                        <button onclick="removeParty('${p.id}')" class="text-slate-400 hover:text-red-600">×</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // Dynamisches Generieren verschiedener Live-Grafiktypen
        function renderChart(totalSeats) {
            const area = document.getElementById('chart-render-area');
            const legend = document.getElementById('party-legend');
            area.innerHTML = ''; 
            legend.innerHTML = '';
            if (totalSeats === 0) return;

            if (currentChartType === 'arc') {
                // TYPE 1: Parlaments-Halbkreis (Bogen)
                const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                svg.setAttribute('viewBox', '0 0 500 250');
                svg.setAttribute('class', 'w-full max-w-md h-auto overflow-visible');

                const centerX = 250, centerY = 220, rows = 5, minRadius = 60, maxRadius = 180;
                let points = [];

                for (let r = 0; r < rows; r++) {
                    let radius = minRadius + (r * (maxRadius - minRadius) / (rows - 1));
                    let seatsInRow = Math.round(totalSeats / rows);
                    if (r === rows - 1) seatsInRow = totalSeats - points.length;

                    for (let s = 0; s < seatsInRow; s++) {
                        let angle = Math.PI - (s / (seatsInRow - 1 || 1)) * Math.PI;
                        let x = centerX + radius * Math.cos(angle);
                        let y = centerY - radius * Math.sin(angle);
                        points.push({ x, y });
                    }
                }
                points.sort((a, b) => a.x - b.x);

                let currentPointIndex = 0;
                parties.forEach(p => {
                    for (let i = 0; i < p.seats; i++) {
                        if (currentPointIndex < points.length) {
                            let pt = points[currentPointIndex];
                            let circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                            circle.setAttribute('cx', pt.x); circle.setAttribute('cy', pt.y);
                            circle.setAttribute('r', '7'); circle.setAttribute('fill', p.color);
                            circle.setAttribute('stroke', '#ffffff'); circle.setAttribute('stroke-width', '1');
                            svg.appendChild(circle);
                            currentPointIndex++;
                        }
                    }
                });
                area.appendChild(svg);

            } else if (currentChartType === 'bar') {
                // TYPE 2: Gestapelter Balken
                const wrapper = document.createElement('div');
                wrapper.className = 'w-full max-w-md my-auto space-y-3';

                const barContainer = document.createElement('div');
                barContainer.className = 'w-full h-8 bg-slate-100 rounded-lg overflow-hidden flex shadow-inner border';

                parties.forEach(p => {
                    if (p.seats > 0) {
                        const pct = ((p.seats / totalSeats) * 100).toFixed(1);
                        const segment = document.createElement('div');
                        segment.style.width = `${pct}%`;
                        segment.style.backgroundColor = p.color;
                        segment.className = 'h-full transition-all flex items-center justify-center text-[10px] text-white font-bold truncate px-1';
                        segment.title = `${p.name}: ${p.seats} Sitze (${pct}%)`;
                        if (pct > 7) segment.innerText = `${p.seats}`;
                        barContainer.appendChild(segment);
                    }
                });
                wrapper.appendChild(barContainer);
                area.appendChild(wrapper);

            } else if (currentChartType === 'donut') {
                // TYPE 3: Donut-Ring (SVG)
                const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                svg.setAttribute('viewBox', '0 0 200 200');
                svg.setAttribute('class', 'w-40 h-40 overflow-visible my-auto');

                let cumulativePercent = 0;

                parties.forEach(p => {
                    if (p.seats > 0) {
                        const percent = p.seats / totalSeats;
                        const [startX, startY] = getCoordinatesForPercent(cumulativePercent);
                        cumulativePercent += percent;
                        const [endX, endY] = getCoordinatesForPercent(cumulativePercent);

                        const largeArcFlag = percent > 0.5 ? 1 : 0;
                        const pathData = [
                            `M ${startX} ${startY}`,
                            `A 1 1 0 ${largeArcFlag} 1 ${endX} ${endY}`,
                            `L 0 0`,
                        ].join(' ');

                        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                        path.setAttribute('d', pathData);
                        path.setAttribute('fill', p.color);
                        path.setAttribute('stroke', '#ffffff');
                        path.setAttribute('stroke-width', '0.05');
                        svg.appendChild(path);
                    }
                });

                // Innerer Kreis für Donut-Effekt
                const innerCircle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                innerCircle.setAttribute('cx', '0'); innerCircle.setAttribute('cy', '0');
                innerCircle.setAttribute('r', '0.6'); innerCircle.setAttribute('fill', '#ffffff');
                svg.appendChild(innerCircle);

                svg.setAttribute('viewBox', '-1.1 -1.1 2.2 2.2');
                area.appendChild(svg);
            }

            // Legende rendern
            parties.forEach(p => {
                const legItem = document.createElement('div');
                legItem.className = 'flex items-center gap-1';
                legItem.innerHTML = `<span class="w-2.5 h-2.5 rounded-full" style="background-color: ${p.color}"></span> ${p.name} (${p.seats})`;
                legend.appendChild(legItem);
            });
        }

        function getCoordinatesForPercent(percent) {
            const x = Math.cos(2 * Math.PI * percent - Math.PI / 2);
            const y = Math.sin(2 * Math.PI * percent - Math.PI / 2);
            return [x, y];
        }

        function renderGroups() {
            const container = document.getElementById('groups-container');
            container.innerHTML = '';
            const totalCouncilSeats = parties.reduce((sum, p) => sum + p.seats, 0);

            groups.forEach(g => {
                let groupSeatCount = 0;
                g.partyIds.forEach(pId => {
                    let p = parties.find(x => x.id === pId);
                    if (p) groupSeatCount += p.seats;
                });
                let isMajority = groupSeatCount > Math.floor(totalCouncilSeats / 2);

                const card = document.createElement('div');
                card.className = 'p-2.5 border rounded-lg bg-slate-50 flex flex-col justify-between text-xs';
                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-center mb-1">
                            <input type="text" value="${g.name}" onchange="updateGroupName('${g.id}', this.value)" class="font-bold text-slate-800 bg-transparent border-b border-transparent focus:border-blue-500 w-full">
                            <button onclick="removeGroup('${g.id}')" class="text-slate-400 hover:text-red-600 no-print">×</button>
                        </div>
                        <div class="flex flex-wrap gap-1 mb-2 no-print">
                            ${parties.map(p => {
                                const selected = g.partyIds.includes(p.id);
                                return `<button onclick="togglePartyInGroup('${g.id}', '${p.id}')" class="px-1.5 py-0.5 rounded text-[10px] border ${selected ? 'bg-slate-800 text-white' : 'bg-white text-slate-600'}">${p.name}</button>`;
                            }).join('')}
                        </div>
                    </div>
                    <div class="flex justify-between items-center pt-1 border-t">
                        <span class="font-bold">${groupSeatCount} Sitze</span>
                        ${isMajority ? `<span class="bg-emerald-100 text-emerald-800 font-bold px-2 py-0.5 rounded text-[10px]">Mehrheit</span>` : ''}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderCommittees() {
            const container = document.getElementById('committees-container');
            container.innerHTML = '';
            const method = document.getElementById('calc-method').value;

            committees.forEach(c => {
                const { summary, steps } = calculateCommitteeSeats(c.seats, method);
                const card = document.createElement('div');
                card.className = 'border rounded-lg p-2.5 bg-slate-50 text-xs';
                card.innerHTML = `
                    <div class="flex justify-between items-center border-b pb-1 mb-2">
                        <span class="font-bold text-slate-800">${c.name}</span>
                        <div class="flex items-center gap-1">
                            <span class="text-[10px] text-slate-500">Sitze:</span>
                            <input type="number" min="1" value="${c.seats}" onchange="updateCommitteeSeats('${c.id}', this.value)" class="w-10 text-center font-bold bg-white border rounded">
                            <button onclick="removeCommittee('${c.id}')" class="text-slate-400 hover:text-red-600 no-print ml-1">×</button>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <div class="font-semibold text-[10px] text-slate-500 mb-1">Verteilung:</div>
                            ${summary.map(item => `
                                <div class="flex justify-between py-0.5 border-b border-slate-100">
                                    <span class="truncate">${item.name}</span>
                                    <span class="font-bold ml-1">${item.assignedSeats}</span>
                                </div>
                            `).join('')}
                        </div>
                        <div>
                            <div class="font-semibold text-[10px] text-slate-500 mb-1">Zugriffe (1-${c.seats}):</div>
                            <div class="flex flex-wrap gap-1">
                                ${steps.map(s => `
                                    <span class="bg-white border px-1 rounded text-[10px]" style="border-left: 3px solid ${s.color}">
                                        ${s.rank}.${s.entityName}
                                    </span>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.onload = function() {
            loadSavedData();
            renderAll();
        };
    </script>
</body>
</html>
